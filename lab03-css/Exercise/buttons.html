<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task 5 – Button Styling Collection</title>

  <!-- Project CSS -->
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/typography.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/effects.css">

  <style>
    /* Base page styles */
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top left, #2b3a67, #0f1220);
      color: #e6e8f2;
    }
    .container {
      width: min(1100px, 100% - 2rem);
      margin: auto;
      padding: 2rem 0;
    }
    .card {
      background: #171a2b;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    h1, h2 { margin-top: 0; }

    /* ========================================================
       BUTTON SYSTEM
    ========================================================= */

    /* Base button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .6rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: 
        background .25s ease,
        transform .2s ease,
        box-shadow .25s ease,
        opacity .25s ease;
    }

    /* Sizes */
    .btn-sm { padding: .35rem .8rem; font-size: .85rem; }
    .btn-lg { padding: .9rem 1.8rem; font-size: 1.25rem; border-radius: 12px; }

    /* Shapes */
    .pill { border-radius: 999px; }
    .square { border-radius: 4px; }

    /* Solid colors */
    .primary { background: #3c7cff; }
    .success { background: #16a34a; }
    .danger  { background: #ef4444; }
    .dark    { background: #0f172a; border: 1px solid #334155; }

    /* Hover & focus */
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
      filter: brightness(1.08);
    }
    .btn:focus {
      outline: 3px solid #6aa2ff;
      outline-offset: 3px;
    }

    /* Gradient buttons */
    .gradient-blue {
      background: linear-gradient(135deg, #3c7cff, #6aa2ff);
    }
    .gradient-purple {
      background: linear-gradient(135deg, #8b5cf6, #c084fc);
    }
    .gradient-fire {
      background: linear-gradient(135deg, #f97316, #ef4444, #dc2626);
    }

    /* Shadow buttons */
    .shadow-soft { box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    .shadow-hard { box-shadow: 0 12px 35px rgba(0,0,0,.55); }

    /* Ghost button */
    .ghost {
      background: transparent;
      border: 2px solid #6aa2ff;
      color: #6aa2ff;
    }
    .ghost:hover {
      background: #6aa2ff;
      color: #0f122a;
    }

    /* Disabled */
    .btn:disabled,
    .btn.disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Icon example */
    .icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <main class="container">
    <div class="card">
      <h1>Button Styling Collection</h1>
      <p>Different sizes, colors, shapes, gradients, shadows, hover/focus states, transitions & disabled buttons.</p>
      <p><a href="../index.html" style="color:#6aa2ff;">← Back to Home</a></p>
    </div>

    <!-- Sizes -->
    <div class="card">
      <h2>Button Sizes</h2>
      <button class="btn btn-sm primary">Small Button</button>
      <button class="btn primary">Default Button</button>
      <button class="btn btn-lg primary">Large Button</button>
    </div>

    <!-- Shapes -->
    <div class="card">
      <h2>Button Shapes</h2>
      <button class="btn primary pill">Pill Button</button>
      <button class="btn success square">Square Button</button>
      <button class="btn danger" style="border-radius:20px;">Rounded Button</button>
    </div>

    <!-- Colors -->
    <div class="card">
      <h2>Color Variants</h2>
      <button class="btn primary">Primary</button>
      <button class="btn success">Success</button>
      <button class="btn danger">Danger</button>
      <button class="btn dark">Dark</button>
      <button class="btn ghost">Ghost Button</button>
    </div>

    <!-- Gradients -->
    <div class="card">
      <h2>Gradient Buttons</h2>
      <button class="btn gradient-blue">Blue Gradient</button>
      <button class="btn gradient-purple">Purple Gradient</button>
      <button class="btn gradient-fire btn-lg">Fire Gradient</button>
    </div>

    <!-- Shadows -->
    <div class="card">
      <h2>Shadow Buttons</h2>
      <button class="btn primary shadow-soft">Soft Shadow</button>
      <button class="btn primary shadow-hard">Hard Shadow</button>
    </div>

    <!-- Hover / Focus -->
    <div class="card">
      <h2>Hover + Focus Effects</h2>
      <button class="btn success pill">Hover Me</button>
      <button class="btn danger">Also Hover Me</button>
      <button class="btn dark">Focus Me (Tab)</button>
    </div>

    <!-- Disabled -->
    <div class="card">
      <h2>Disabled Buttons</h2>
      <button class="btn primary" disabled>Disabled</button>
      <button class="btn success disabled">Disabled Class</button>
    </div>

    <!-- Icon Buttons -->
    <div class="card">
      <h2>Buttons with Icons</h2>
      <button class="btn primary">
        <span class="icon">⭐</span>
        Star
      </button>
      <button class="btn dark pill">
        <span class="icon">⬇️</span>
        Download
      </button>
    </div>

  </main>
</body>
</html>
