<html lang="en">
<head>
    <title>CSS Basics</title>
    <style>
        body {
            margin: 0;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            /* asja */
        }

        .rounded-image {
            width: 150px;
            height: 150px;
            overflow: hidden; /* Clip the image within the container */
            border-radius: 50%; /* Create a circular shape */
            margin-left: 10px;
        }

        img {
            width: 100%;
            height: auto; /* Maintain the aspect ratio of the image */
        }
    </style>
</head>
<body>
    <h1>Welcome to CS 311 - Web Programming</h1>
    <div class="rounded-image">
        <img src="C:\Users\ok\Desktop\Danish.jpg.jpeg" alt="Round Image">
    </div>
</body>
</html>
