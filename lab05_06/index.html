<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Property Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Display Property Showcase</h1>

    <!-- Block vs Inline vs Inline-Block -->
    <section>
        <h2>Block vs Inline vs Inline-Block</h2>

        <div class="block">Block Element</div>
        <span class="inline">Inline Element</span>
        <span class="inline">Inline Element</span>
        <div class="inline-block">Inline-Block Element</div>
        <div class="inline-block">Inline-Block Element</div>
    </section>

    <!-- Table Display Without Table -->
    <section>
        <h2>Table Display (No Table Markup)</h2>

        <div class="table">
            <div class="row">
                <div class="cell">Name</div>
                <div class="cell">Age</div>
                <div class="cell">City</div>
            </div>
            <div class="rowcell">Ali</div>
                <div class="cell">22</div>
                <div class="cell">Lahore</div>
            </div>
            <div class="row">
                <div class="cell">Sara</div>
                <div class="cell">24</div>
                <div class="cell">Karachi</div>
            </div>
        </div>
    </section>

    <!-- Hidden Elements -->
    <section>
        <h2>Hidden Elements</h2>

        <div class="hide-mobile">Hidden on Mobile</div>
        <div class="hide-desktop">Hidden on Desktop</div>
    </section>

</body>
</html>
