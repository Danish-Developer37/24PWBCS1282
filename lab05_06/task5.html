<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Card Layout</title>
    <link rel="stylesheet" href="task5.css">
</head>
<body>

    <h1 class="title">Flexbox Card Layout</h1>

    <div class="card-container">

        <div class="card">
            <div class="card-content">
                <h3>Card One</h3>
                <p>
                    This card has short content.
                </p>
            </div>
            <div class="card-actions">
                <button>Read More</button>
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <h3>Card Two</h3>
                <p>
                    This card has much longer content to demonstrate
                    equal height behavior using Flexbox. All cards
                    will remain the same height.
                </p>
            </div>
            <div class="card-actions">
                <button>Read More</button>
            </div>
        </div>

        <div class="card">
            <div class="card-content">
                <h3>Card Three</h3>
                <p>
                    Medium length content for this card.
                </p>
            </div>
            <div class="card-actions">
                <button>Read More</button>
            </div>
        </div>

    </div>

</body>
</html>
