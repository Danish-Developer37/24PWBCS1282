<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    taskG.css
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>Admin</h2>
        <nav>
            Dashboard
            Users
            Orders
            Settings
        </nav>
    </aside>

    <!-- Main Area -->
    <div class="main">

        <!-- Top Bar -->
        <header class="topbar">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <h1>Dashboard</h1>
        </header>

        <!-- Stats Cards -->
        <section class="stats">
            <div class="card">
                <h3>Users</h3>
                <p>1,200</p>
            </div>
            <div class="card">
                <h3>Sales</h3>
                <p>$8,500</p>
            </div>
            <div class="card">
                <h3>Orders</h3>
                <p>320</p>
            </div>
        </section>

        <!-- Content -->
        <section class="content">
            <h2>Main Content</h2>
            <p>
                This is the responsive main content area of the dashboard.
                CSS Grid is used for layout and Flexbox for internal components.
            </p>
        </section>

    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}
</script>

</body>
</html>
